<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <span class="number">04</span>
        <h1 class="titulo">Título principal</h1>
        <p class="description">
          Al pulsar el botón, el título cambiará a rojo.
        </p>
        <button id="btnColorTitulo">Cambiar a rojo</button>
      </section>
      <section class="card">
        <span class="number">05</span>
        <h1 class="titulo">Elemento destacado</h1>
        <div class="destacados">
          <div class="elementoDestacado">Primer elemento destacado</div>
          <div class="elementoDestacado">Segundo elemento destacado</div>
          <div class="elementoDestacado">Tercer elemento destacado</div>
        </div>
      </section>

      <section class="card">
        <span class="number">06</span>
        <h1 class="titulo">Todos los enlaces</h1>
        <p class="description">
          Abre la consola del navegador para ver las URRs de todos los enlaces
        </p>
        <nav class="links">
          <a href="https://www.google.com" target="_blank">Enlace 1</a>
          <a href="https://www.github.com" target="_blank">Enlace 2</a>
          <a href="https://www.stackoverflow.com" target="_blank">Enlace 3</a>
        </nav>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
