<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/estilos.css" />
        <title>Calculadora IMC</title>
    </head>
    <body>
        <main class="app">
            <section class="card">
                <header class="header">
                    <span class="badge">JavaScript I</span>
                    <h1>Calculadora de IMC</h1>
                    <p>Ingresa tu peso y altura para calcular tu índice de masa corporal</p>
                </header>

                <form id="imcForm">
                    <div class="field">
                        <label for="">Peso</label>
                        <div class="input-wrapper">
                            <input
                                type="number"
                                id="peso"
                                placeholder="Ej. 112"
                                min="1"
                                step="0.1"
                                required
                            />
                            <span>Kg</span>
                        </div>
                    </div>

                    <div class="field">
                        <label for="">Altura</label>
                        <div class="input-wrapper">
                            <input
                                type="number"
                                id="altura"
                                placeholder="Ej. 170"
                                min="0.1"
                                step="0.01"
                                required
                            />
                            <span>m</span>
                        </div>
                    </div>
                    <button type="submit">Calcular</button>
                </form>

                <div id="resultado" class="resultado">
                    <span class="resultado-label">Tu resultado aparecerá aquí:</span>
                    <strong id="valorIMC">--</strong>
                </div>
            </section>
        </main>

        <script src="js/script.js"></script>
    </body>
</html>
