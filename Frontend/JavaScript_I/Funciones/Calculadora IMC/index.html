<!doctype html>
<html lang="en">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/estilos.css" />
        <title>Calculadora IMC</title>
    </head>
    <body>

            <section class="card">

                    </div>
                </form>
            </section>
        </main>

        <script src="js/script.js"></script>
